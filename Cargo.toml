[package]
name = "pfx-pem-converter"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "A small cross-platform GUI for converting PFX/PKCS#12 files to PEM and back"
license = "MIT"
repository = "https://github.com/mcipovic/pfx-pem-converter"
publish = false
keywords = ["pfx", "pem", "pkcs12", "certificate", "openssl"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "pfx-pem"
path = "src/main.rs"

[lib]
name = "pfx_pem_converter"
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
openssl = { version = "0.10.82", features = ["vendored"] }
rfd = "0.18"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
